# Publishes the repo root as a static site on GitHub Pages.
# DNS Quest is vanilla HTML/CSS/JS with no build step, so the artifact is the
# repo itself. Enable Pages once in repo settings: Settings -> Pages ->
# Source: "GitHub Actions".
name: Deploy DNS Quest to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # actions/deploy-pages@v4 lists the run's artifacts via the Actions API;
  # without actions: read that lookup returns empty ("Found 0 artifact(s)")
  # and the deploy fails with "No artifacts named github-pages were found".
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs on purpose: deploy-pages looks the
  # "github-pages" artifact up in the Actions results index exactly once. In a
  # single job that lookup runs ~0.5s after the upload finalizes and can still
  # return an empty list ("Found 0 artifact(s)" / "No artifacts named
  # github-pages were found"). A job boundary guarantees the artifact is fully
  # indexed before deploy-pages runs.
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site (repo root, no build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
